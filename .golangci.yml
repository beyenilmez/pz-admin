version: "2"

run:
  timeout: 5m
  tests: true
  modules-download-mode: readonly

linters:
  default: standard
  enable:
    - asasalint
    - asciicheck
    - bidichk
    - bodyclose
    - copyloopvar
    - dupword
    - durationcheck
    - errorlint
    - errname
    - fatcontext
    - gocheckcompilerdirectives
    - gocritic
    - godot
    - gosec
    - loggercheck
    - makezero
    - misspell
    - modernize
    - nilnesserr
    - noctx
    - nolintlint
    - nosprintfhostport
    - predeclared
    - revive
    - sloglint
    - thelper
    - unconvert
    - unparam
    - usestdlibvars
    - usetesting
    - wastedassign
    - whitespace
  settings:
    govet:
      enable-all: true
      disable:
        - fieldalignment
    nolintlint:
      require-explanation: true
      require-specific: true
  exclusions:
    # Mobile build scaffolding is unused until Android/iOS support is resumed.
    paths:
      - ^build/(android|ios)/
    presets:
      - common-false-positives
    rules:
      - path: _test\.go
        linters:
          - gosec
          - noctx

formatters:
  enable:
    - gofumpt
    - goimports
  exclusions:
    paths:
      - ^build/(android|ios)/
