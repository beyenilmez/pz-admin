name: Bug Report
description: Report a bug or unexpected behavior
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: What happened?
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to Reproduce
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics
      description: Copy diagnostic information from Settings → Diagnostics. If the app cannot open, provide the app version and OS instead.
      render: text
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Include relevant logs or screenshots, how you installed the app, and the Project Zomboid server build if applicable. Remove passwords, tokens and other private information.
