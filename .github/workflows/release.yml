name: Release

on:
  push:
    branches: [main]
    paths-ignore:
      - frontend/website/**
      - frontend/src/website/**
      - frontend/vite.website.config.ts
      - .github/workflows/website.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Prepare release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    outputs:
      created: ${{ steps.release.outputs.release_created }}
      tag: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5
        id: release
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN }}

  package:
    name: Build release packages
    needs: release
    if: needs.release.outputs.created == 'true'
    uses: ./.github/workflows/package.yml
    with:
      ref: ${{ needs.release.outputs.tag }}
      release_tag: ${{ needs.release.outputs.tag }}

  flatpak:
    name: Build and check release Flatpaks
    needs: release
    if: needs.release.outputs.created == 'true'
    uses: ./.github/workflows/flatpak.yml
    with:
      ref: ${{ needs.release.outputs.tag }}
      release_tag: ${{ needs.release.outputs.tag }}

  publish:
    name: Publish release
    needs: [release, package, flatpak]
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ needs.release.outputs.tag }}
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        env:
          CGO_ENABLED: "0"
        with:
          cache_key_prefix: mise-nocgo-v1
          install_args: --locked go go:github.com/wailsapp/wails/v3/cmd/wails3
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: pz-admin-*
          path: packages
          merge-multiple: true
      - name: Upload packages and publish
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.release.outputs.tag }}
          UPDATER_PRIVATE_KEY: ${{ secrets.UPDATER_PRIVATE_KEY }}
        run: |
          test -n "$UPDATER_PRIVATE_KEY" || { echo "UPDATER_PRIVATE_KEY is required" >&2; exit 1; }
          umask 077
          key_file=$(mktemp "$RUNNER_TEMP/updater-key.XXXXXX")
          trap 'rm -f "$key_file"' EXIT
          printf '%s' "$UPDATER_PRIVATE_KEY" > "$key_file"
          unset UPDATER_PRIVATE_KEY
          gh release view "$RELEASE_TAG" --json body --jq .body > "$RUNNER_TEMP/release-notes.md"
          wails3 updater manifest -version "${RELEASE_TAG#v}" -channel stable \
            -key "$key_file" \
            -name "PZ Admin ${RELEASE_TAG#v}" -notes-file "$RUNNER_TEMP/release-notes.md" \
            -url-prefix "https://github.com/$GH_REPO/releases/download/$RELEASE_TAG" \
            -output packages/manifest.json packages/*-update.exe packages/*-update.zip
          wails3 updater verify -manifest packages/manifest.json -publickey internal/update/updater.pub
          gh release upload "$RELEASE_TAG" packages/* --clobber
          gh release edit "$RELEASE_TAG" --draft=false --latest

  cloudsmith:
    name: Publish Linux package repository
    needs: [release, publish]
    permissions:
      contents: read
      id-token: write
    uses: ./.github/workflows/cloudsmith.yml
    with:
      release_tag: ${{ needs.release.outputs.tag }}

  aur:
    name: Publish AUR package
    needs: [release, publish]
    uses: ./.github/workflows/aur.yml
    with:
      release_tag: ${{ needs.release.outputs.tag }}
    secrets:
      AUR_SSH_PRIVATE_KEY: ${{ secrets.AUR_SSH_PRIVATE_KEY }}
