name: Renovate

on:
  pull_request:
    branches: [main]
    types: [closed]
  schedule:
    # Mondays and Thursdays at 06:23 in Istanbul (03:23 UTC).
    - cron: "23 3 * * 1,4"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: renovate
  cancel-in-progress: false

jobs:
  renovate:
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.merged == true &&
       github.event.pull_request.head.repo.full_name == github.repository &&
       startsWith(github.event.pull_request.head.ref, 'renovate/'))
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: renovatebot/github-action@a63d9a7bc606f7336fd20b47f2f32259a35e6213 # v46.3.9
        with:
          token: ${{ secrets.RENOVATE_TOKEN }}
        env:
          RENOVATE_GIT_AUTHOR: "github-actions[bot] <41898282+github-actions[bot]@users.noreply.github.com>"
          RENOVATE_REPOSITORIES: ${{ github.repository }}
          RENOVATE_ALLOWED_UNSAFE_EXECUTIONS: mise
          RENOVATE_ALLOWED_COMMANDS: '["^mise trust$", "^mise lock go go:github[.]com/wailsapp/wails/v3/cmd/wails3$"]'
