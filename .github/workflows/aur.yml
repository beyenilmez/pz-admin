name: AUR

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Latest published stable release tag (for example, v2.1.0)
        required: true
        type: string
  workflow_call:
    inputs:
      release_tag:
        description: Published stable release tag
        required: true
        type: string
    secrets:
      AUR_SSH_PRIVATE_KEY:
        required: false

permissions:
  contents: read

concurrency:
  group: aur
  cancel-in-progress: false

jobs:
  publish:
    name: Prepare and publish AUR package
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ inputs.release_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - name: Download latest release packages
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          # An older release must not roll back the AUR package.
          test "$(gh release view --json tagName --jq .tagName)" = "$RELEASE_TAG"
          gh release view "$RELEASE_TAG" --json isDraft,isPrerelease \
            --jq '(.isDraft == false) and (.isPrerelease == false)' | grep -qx true
          gh release download "$RELEASE_TAG" --dir packages \
            --pattern "pz-admin-${RELEASE_TAG#v}-linux-*.pkg.tar.zst"
      - name: Generate PKGBUILD
        id: package
        run: |
          python3 scripts/aur/prepare.py "$RELEASE_TAG" "$GH_REPO" packages .generated/aur
          echo "version=${RELEASE_TAG#v}-1" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: aur-pz-admin-bin
          path: .generated/aur/PKGBUILD
          if-no-files-found: error
          retention-days: 7
      # Enable publishing after the AUR account and SSH key are configured.
      # - name: Publish AUR package
