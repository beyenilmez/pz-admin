name: Flatpak

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Published stable release tag to build (for example, v2.1.0); leave empty to build the selected ref
        required: false
        type: string
        default: ""
  workflow_call:
    inputs:
      ref:
        description: Git ref to check
        required: true
        type: string
      release_tag:
        description: Release tag for published builds
        type: string
        default: ""

permissions:
  contents: read

jobs:
  flatpak:
    name: Flatpak (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-26.04
            arch: x86_64
            filename_arch: x64
          - runner: ubuntu-26.04-arm
            arch: aarch64
            filename_arch: arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          ref: ${{ inputs.release_tag || inputs.ref || github.sha }}
      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y flatpak dbus
      - uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4
        env:
          CGO_ENABLED: "0"
        with:
          cache_key_prefix: mise-nocgo-v1
          install_args: --locked go node npm:pnpm go:github.com/wailsapp/wails/v3/cmd/wails3
      - name: Install Flatpak SDKs
        run: wails3 task linux:flatpak:setup
      - name: Package and check
        shell: dbus-run-session -- bash --noprofile --norc -e -o pipefail {0}
        env:
          RELEASE_TAG: ${{ inputs.release_tag || (github.ref_type == 'tag' && github.ref_name) || '' }}
          SOURCE_REF: ${{ inputs.release_tag || inputs.ref || (github.ref_type == 'tag' && github.ref_name) || github.sha }}
        run: |
          wails3 task linux:flatpak:package PINNED=true
          wails3 task linux:flatpak:check PINNED=true
      - name: Stage bundle
        run: |
          mkdir -p .generated/artifacts
          version=$(tr -d '\r\n' < VERSION)
          cp bin/pz-admin.flatpak ".generated/artifacts/pz-admin-$version-linux-${{ matrix.filename_arch }}.flatpak"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: pz-admin-flatpak-${{ matrix.arch }}
          path: .generated/artifacts/*.flatpak
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: flathub-manifest-${{ matrix.arch }}
          path: |
            .generated/flatpak/com.bedirhanyenilmez.pzadmin.yml
            .generated/flatpak/app-sources.json
            .generated/flatpak/dependency-sources.json
          if-no-files-found: error
          retention-days: 7
