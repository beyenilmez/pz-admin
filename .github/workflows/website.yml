name: Website

on:
  push:
    branches: [main]
    paths:
      - frontend/**
      - assets/screenshots/**
      - build/appicon.svg
      - VERSION
      - mise.toml
      - mise.lock
      - .github/workflows/website.yml
  pull_request:
    paths:
      - frontend/**
      - assets/screenshots/**
      - build/appicon.svg
      - VERSION
      - mise.toml
      - mise.lock
      - .github/workflows/website.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: website-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build website
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false
      - uses: jdx/mise-action@6612f0ef07ed2a736cd1e00a94a065522dd41195 # v5
        with:
          install_args: --locked node npm:pnpm
      - run: pnpm --dir frontend install --frozen-lockfile
      - run: pnpm --dir frontend website:build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5
        with:
          path: frontend/dist-website

  deploy:
    name: Deploy website
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6
      - uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5
        id: deployment
